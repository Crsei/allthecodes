[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

[profile.local]
inherits = "default"

[test-groups.tui_pty_e2e]
# Phase 2: lifted the global pty serialization lock (harness.rs `cleanup_lock`),
# but kept max-threads = 1. Reason: shared `/tmp/cc-rust-e2e-test` workspace
# state (settings.json / sessions.db) races between concurrent cc-rust children —
# at max-threads=2 a 16-test sweep flakes ~2/16 (effort_shows_current,
# config_alias_settings); max-threads=4 flakes ~3/16. The lock lift is real
# (concurrent_sessions_do_not_serialize passes) and correct — Phase 3 will ship
# per-session workspace isolation and bump this to 2 → 4.
max-threads = 1

[test-groups.integration_process_heavy]
max-threads = 2

[[profile.default.overrides]]
# 用 `binary(pty_tui_e2e)` 而非 `test(pty_tui_e2e)`：nextest 的 `test(NAME)`
# 按"测试名"匹配，而 pty_tui_e2e 是 binary 名，没有任何测试名字里带这个字面；旧
# 滤片 `package(allthecodes) & test(pty_tui_e2e)` 实际匹配 0 个测试（
# `cargo nextest show-config test-groups` 显示该组 `(no matches)`），等于 max-threads=1
# 不生效，217 个测试被 nextest 默认并发跑，共享 workspace 出 24/217 flake。
# `binary(pty_tui_e2e)` 才按"测试 binary 名"匹配，命中全部 217 个测试。
filter = 'binary(pty_tui_e2e)'
test-group = 'tui_pty_e2e'
slow-timeout = { period = "45s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(headless) | test(ipc) | test(daemon)'
test-group = 'integration_process_heavy'
slow-timeout = { period = "45s", terminate-after = 2 }
