[package]
name = "allthecodes-tasks"
version = "0.1.0"
edition = "2021"
description = "Task domain types, parsing, errors, and persistence shapes."

[features]
default = ["sqlite-storage"]
sqlite-storage = ["dep:allthecodes-db", "dep:sqlx"]
json-storage = []

[dependencies]
allthecodes-db = { workspace = true, optional = true }
allthecodes-types = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
