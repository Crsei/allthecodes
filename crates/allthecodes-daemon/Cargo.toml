[package]
license.workspace = true
name = "allthecodes-daemon"
version = "0.1.0"
edition = "2021"
description = "KAIROS daemon: HTTP/SSE server, proactive tick, webhooks, team-memory proxy. Phase 7 workspace split (scaffold)."

[features]
default = ["sqlite-storage", "json-storage"]
sqlite-storage = ["dep:allthecodes-db", "dep:sqlx"]
json-storage = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
allthecodes-commands = { workspace = true }
allthecodes-auth = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-db = { workspace = true, optional = true }
allthecodes-engine = { workspace = true }
allthecodes-protocol = { workspace = true }
allthecodes-services = { workspace = true }
allthecodes-tasks = { workspace = true }
allthecodes-tools = { workspace = true }
allthecodes-types = { workspace = true }
allthecodes-utils = { workspace = true }
allthecodes-server = { workspace = true }
allthecodes-session = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
allthecodes-gateway = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
keyring = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true, optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
allthecodes-bootstrap = { workspace = true }
allthecodes-skills = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
