[package]
name = "allthecodes-server"
version = "0.1.0"
edition = "2021"
description = "Transport abstraction and server lifecycle for allthecodes HTTP servers."

[dependencies]
allthecodes-types = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
