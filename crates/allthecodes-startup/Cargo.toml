[package]
name = "allthecodes-startup"
version = "0.1.0"
edition = "2021"
description = "Process startup helpers for cc-rust."

[features]
default = []
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
    "allthecodes-services/telemetry",
]

[lib]
path = "src/mod.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
allthecodes-api = { workspace = true }
allthecodes-browser = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-engine = { workspace = true }
allthecodes-lsp-service = { workspace = true }
allthecodes-mcp = { workspace = true }
allthecodes-permissions = { workspace = true }
allthecodes-plugins = { workspace = true }
allthecodes-services = { workspace = true }
allthecodes-tasks = { workspace = true }
allthecodes-teams = { workspace = true }
allthecodes-tools = { workspace = true }
allthecodes-types = { workspace = true }
allthecodes-worktree = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-langfuse = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
