[package]
name = "allthecodes-session"
version = "0.1.0"
edition = "2021"
description = "Session persistence for allthecodes — conversation state, transcripts, memdir, exports"
build = "build.rs"

[features]
default = ["sqlite-storage", "json-storage"]
sqlite-storage = ["dep:allthecodes-db", "dep:sqlx"]
json-storage = []

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
git2 = { workspace = true }
sqlx = { workspace = true, optional = true }

allthecodes-db = { workspace = true, optional = true }
allthecodes-types = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-models = { workspace = true }
allthecodes-utils = { workspace = true }
allthecodes-bootstrap = { workspace = true }
allthecodes-compact = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
