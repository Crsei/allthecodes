[package]
name = "allthecodes"
version = "0.1.5"
edition = "2021"
description = "allthecodes CLI"
build = "build.rs"

# ============================================================
# Features
# ============================================================
#
# default 闂?minimal build: no telemetry, no embedded web assets,
#           no image/syntect/tree-sitter pulls. Keeps `cargo build`
#           fast and avoids heavy native deps (onig, tonic/prost).
#
# Opt-in:
#   telemetry   闂?Langfuse + OpenTelemetry export (pulls tonic/prost).
#   web-ui      闂?Embed the React SPA (rust-embed) into the binary.
#   image       闂?Image decoding (png/jpeg only).
#   syntect     闂?Syntax highlighting via fancy-regex (no onig C dep).
#   tree-sitter 闂?AST parsing.

[features]
default = []
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
    "allthecodes-engine/telemetry",
    "allthecodes-services/telemetry",
    "allthecodes-startup/telemetry",
]
web-ui = ["allthecodes-web/web-ui"]
image = ["dep:image"]
syntect = ["dep:syntect"]
tree-sitter = ["dep:tree-sitter"]

[dependencies]
# 閻庢鍠栭崐褰掝敆閻愬瓨浜ら柟閭﹀灱閺€浠嬫煛?
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

# 闁瑰吋娼欑换鎰板垂椤忓牆绀?
serde = { workspace = true }
