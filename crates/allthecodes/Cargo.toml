[package]
license.workspace = true
name = "allthecodes"
version = "0.1.13"
edition = "2021"
description = "allthecodes CLI"

# ============================================================
# Features
# ============================================================
#
# default: release-ready CLI build with image paste support and syntax
#          highlighting, but no telemetry, no embedded web assets, and no
#          tree-sitter pulls.
#
# Opt-in:
#   telemetry   - Langfuse + OpenTelemetry export (pulls tonic/prost).
#   tree-sitter - AST parsing.

[features]
default = ["image", "syntect"]
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
    "allthecodes-engine/telemetry",
    "allthecodes-services/telemetry",
    "allthecodes-startup/telemetry",
]
image = ["dep:image"]
syntect = ["dep:syntect"]
tree-sitter = ["dep:tree-sitter"]

[dependencies]
# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# CLI
clap = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# LRU
lru = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-langfuse = { workspace = true, optional = true }

# LSP
lsp-types = { workspace = true }

# Filesystem and paths
glob = { workspace = true }
ignore = { workspace = true }
walkdir = { workspace = true }
dirs = { workspace = true }

# Regex
regex = { workspace = true }

# Git
git2 = { workspace = true }

# Diff
similar = { workspace = true }

# Shell parsing
shell-words = { workspace = true }

# Terminal UI
ratatui = { workspace = true }
crossterm = { workspace = true }

# Text rendering
syntect = { workspace = true, optional = true }

# Text rendering
textwrap = { workspace = true }
unicode-width = { workspace = true }
strip-ansi-escapes = { workspace = true }

# Markdown
pulldown-cmark = { workspace = true }

# Hashing
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }

# Networking
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
semver = { workspace = true }

# Networking
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
eventsource-stream = { workspace = true }

# Authentication and environment
keyring = { workspace = true }
dotenvy = { workspace = true }

# Synchronization
parking_lot = { workspace = true }

# Workspace crates
allthecodes-keybindings = { workspace = true }
allthecodes-observability = { workspace = true }
allthecodes-types = { workspace = true }
allthecodes-bootstrap = { workspace = true }
allthecodes-auth = { workspace = true }
allthecodes-api = { workspace = true }
allthecodes-skills = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-utils = { workspace = true }
allthecodes-mcp = { workspace = true }
allthecodes-plugins = { workspace = true }
allthecodes-services = { workspace = true }
allthecodes-computer-use = { workspace = true }
allthecodes-safety = { workspace = true }
allthecodes-compact = { workspace = true }
allthecodes-sandbox = { workspace = true }
allthecodes-permissions = { workspace = true }
allthecodes-browser = { workspace = true }
allthecodes-lsp-service = { workspace = true }
allthecodes-session = { workspace = true }
allthecodes-engine = { workspace = true }
allthecodes-tools = { workspace = true }
allthecodes-tasks = { workspace = true }
allthecodes-teams = { workspace = true }
allthecodes-commands = { workspace = true }
allthecodes-daemon = { workspace = true }
allthecodes-ipc = { workspace = true }
allthecodes-ipc-protocol = { workspace = true }
allthecodes-startup = { workspace = true }
allthecodes-voice = { workspace = true }
allthecodes-web = { workspace = true }
allthecodes-worktree = { workspace = true }
allthecodes-gateway = { workspace = true }
allthecodes-db = { workspace = true }
allthecodes-tool-display = { path = "../allthecodes-tool-display" }
allthecodes-acp = { path = "../allthecodes-acp" }
allthecodes-server = { workspace = true }

# Daemon
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hmac = { workspace = true }

# AST parsing
tree-sitter = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tempfile = { workspace = true }
sqlx = { workspace = true }

# Platform sandbox helpers
which = { workspace = true }
once_cell = "1.21.4"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
assert_fs = { workspace = true }
insta = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
serial_test = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
