[package]
name = "allthecodes-web"
version = "0.1.0"
edition = "2021"
description = "Axum web UI server for cc-rust."

[features]
default = []
web-ui = ["dep:rust-embed"]

[lib]
path = "src/mod.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
allthecodes-auth = { workspace = true }
allthecodes-api = { workspace = true }
allthecodes-bootstrap = { workspace = true }
allthecodes-commands = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-computer-use = { workspace = true }
allthecodes-daemon = { workspace = true }
allthecodes-engine = { workspace = true }
allthecodes-gateway = { workspace = true }
allthecodes-ipc = { workspace = true }
allthecodes-ipc-protocol = { workspace = true }
allthecodes-mcp = { workspace = true }
allthecodes-permissions = { workspace = true }
allthecodes-plugins = { workspace = true }
allthecodes-protocol = { workspace = true }
allthecodes-services = { workspace = true }
allthecodes-session = { workspace = true }
allthecodes-skills = { workspace = true }
allthecodes-types = { workspace = true }
allthecodes-utils = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "process", "io-util"] }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
