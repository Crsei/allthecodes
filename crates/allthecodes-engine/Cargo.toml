[package]
license.workspace = true
name = "allthecodes-engine"
version = "0.1.0"
edition = "2021"
description = "QueryEngine, canonical query loop, AppState, Tool trait, and status-line runner."

# Query boundary decision:
# `crates/allthecodes-engine/src/query/` is the only production query loop.
# The previous independent `allthecodes-query` crate was removed because it
# duplicated behavior. Future extraction must happen exactly once into a
# canonical crate, after stable typed boundaries replace direct engine-internal
# coupling.

[dependencies]
# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors / logging
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-langfuse = { workspace = true, optional = true }

# Shared primitives
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }

# Git (for status-line payload repo lookups)
git2 = { workspace = true }

# Workspace siblings (only leaf / already-extracted crates)
allthecodes-types = { workspace = true }
allthecodes-config = { workspace = true }
allthecodes-bootstrap = { workspace = true }
allthecodes-observability = { workspace = true }
allthecodes-permissions = { workspace = true }
allthecodes-compact = { workspace = true }
allthecodes-keybindings = { workspace = true }
allthecodes-utils = { workspace = true }
allthecodes-langfuse = { workspace = true }
allthecodes-session = { workspace = true }
allthecodes-sandbox = { workspace = true }
allthecodes-api = { workspace = true }
allthecodes-mcp = { workspace = true }
allthecodes-browser = { workspace = true }
allthecodes-lsp-service = { workspace = true }
allthecodes-skills = { workspace = true }
allthecodes-ipc-protocol = { workspace = true }
dirs = { workspace = true }
allthecodes-tasks = { workspace = true }
allthecodes-tools = { workspace = true }
allthecodes-shell-command = { workspace = true }

[features]
default = []
# Telemetry enables engine-owned Langfuse and bridge call sites.
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-langfuse",
]

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
